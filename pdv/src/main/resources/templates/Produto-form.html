<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/images/css/theme.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{menu :: menu}"></div>
<div class="container mt-4">
    <h2>Cadastro de Produto</h2>

    <form th:action="@{/produtos}" th:object="${produto}" method="post">
        <input type="hidden" th:field="*{idProduto}">

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}">
        </div>

        <div class="mb-3">
            <label class="form-label">Código de Barras</label>
            <input type="text" class="form-control" th:field="*{codigoBarras}">
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea class="form-control" th:field="*{descricao}"></textarea>
        </div>

        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Preço de Venda</label>
                <input type="number" step="0.01" class="form-control" th:field="*{precoVenda}">
            </div>
            <div class="col mb-3">
                <label class="form-label">Preço de Custo</label>
                <input type="number" step="0.01" class="form-control" th:field="*{precoCusto}">
            </div>
        </div>

        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Quantidade em Estoque</label>
                <input type="number" class="form-control" th:field="*{quantidadeEstoque}">
            </div>
            <div class="col mb-3">
                <label class="form-label">Estoque Mínimo</label>
                <input type="number" class="form-control" th:field="*{estoqueMinimo}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Validade</label>
            <input type="date" class="form-control" th:field="*{validade}">
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-control" th:field="*{status}">
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoria</label>
            <div class="d-flex gap-2">
                <select class="form-control" name="categoria.idCategoria">
                    <option value="">Selecione...</option>
                    <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.nome}"></option>
                </select>
                <a th:href="@{/categorias/novo}" class="btn btn-outline-success" target="_blank">+ Categoria</a>
            </div>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a th:href="@{/produtos}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
