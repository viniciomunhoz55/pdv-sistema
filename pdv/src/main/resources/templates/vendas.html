<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vendas - PDV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/images/css/theme.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{menu :: menu}"></div>

<div class="container">
    <h1 class="mb-4">Vendas</h1>

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <table class="table table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Data/Hora</th>
                <th>Cliente</th>
                <th>Forma de Pagamento</th>
                <th>Total</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="venda : ${vendas}">
                <td th:text="${venda.idVenda}"></td>
                <td th:text="${#temporals.format(venda.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${venda.cliente != null ? venda.cliente.nome : 'Sem cliente'}"></td>
                <td th:text="${venda.formaPagamento}"></td>
                <td th:text="${'R$ ' + #numbers.formatDecimal(venda.total, 1, 2)}"></td>
                <td>
                    <a th:href="@{'/vendas/' + ${venda.idVenda} + '/cupom'}" class="btn btn-sm btn-outline-primary">Ver Cupom</a>
                    <form th:action="@{'/vendas/' + ${venda.idVenda} + '/cancelar'}" method="post" style="display:inline;"
                          onsubmit="return confirm('Cancelar esta venda e devolver o estoque?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
