<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meu PDV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b1f4d 0%, #143a7a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .home-container { max-width: 950px; width: 100%; padding: 40px 20px; }

        .logo-area { text-align: center; margin-bottom: 45px; }
        .logo-circle {
        max-width: 420px;
        margin: 0 auto 15px auto;
        }
        .logo-circle img {
        width: 100%;
        border-radius: 16px;
        box-shadow: 0 0 30px rgba(45,110,230,0.5);
        mix-blend-mode: screen;
        }
        .logo-area h1 { color: #fff; font-weight: 800; letter-spacing: 1px; margin: 0; }
        .logo-area p { color: #9db8ee; margin: 0; }

        .card-menu {
            position: relative;
            background: linear-gradient(145deg, #1c3f8f, #12306f);
            border: 2px solid #2f5bb7;
            border-radius: 22px;
            padding: 35px 15px 25px 15px;
            text-align: center;
            color: #fff;
            text-decoration: none;
            display: block;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            height: 100%;
        }
        .card-menu:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.45);
            color: #fff;
        }
        .icon-wrap {
            position: relative;
            width: 70px; height: 70px;
            margin: 0 auto 15px auto;
        }
        .icon-wrap i.principal {
            font-size: 2.6rem;
            color: #cfe0ff;
        }
        .badge-acao {
            position: absolute;
            bottom: -4px; right: -8px;
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
            color: #fff;
            border: 2px solid #12306f;
        }
        .badge-add { background: #2fb344; }
        .badge-search { background: #2f8fe0; }

        .card-menu span { font-weight: 700; font-size: 1.05rem; }

        .linha-baixo { display: flex; justify-content: center; gap: 1.5rem; margin-top: 1.5rem; }
        .linha-baixo .col-6 { max-width: 260px; }

        .rodape { text-align: center; color: #a9c3f5; margin-top: 35px; font-style: italic; }
    </style>
</head>
<body>
<div class="home-container">

    <div class="logo-area">
    <div class="logo-circle">
        <img src="/images/logoprincipal.jpeg" alt="Mascote PDV" style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;">
    </div>
    <h1></h1>
    <p>Seu ponto de venda mais simples!</p>
</div>

    <div class="row g-4">
        <div class="col-6 col-md-4">
            <a th:href="@{/clientes/novo}" class="card-menu">
                <div class="icon-wrap">
                    <i class="bi bi-person-fill principal"></i>
                    <span class="badge-acao badge-add"><i class="bi bi-plus-lg"></i></span>
                </div>
                <span>Cadastrar Cliente</span>
            </a>
        </div>
        <div class="col-6 col-md-4">
            <a th:href="@{/clientes}" class="card-menu">
                <div class="icon-wrap">
                    <i class="bi bi-person-fill principal"></i>
                    <span class="badge-acao badge-search"><i class="bi bi-search"></i></span>
                </div>
                <span>Consultar Cliente</span>
            </a>
        </div>
        <div class="col-6 col-md-4">
            <a th:href="@{/produtos/novo}" class="card-menu">
                <div class="icon-wrap">
                    <i class="bi bi-box-seam-fill principal"></i>
                    <span class="badge-acao badge-add"><i class="bi bi-plus-lg"></i></span>
                </div>
                <span>Cadastrar Produtos</span>
            </a>
        </div>
    </div>

    <div class="row linha-baixo">
        <div class="col-6">
            <a th:href="@{/produtos}" class="card-menu">
                <div class="icon-wrap">
                    <i class="bi bi-box-seam-fill principal"></i>
                    <span class="badge-acao badge-search"><i class="bi bi-search"></i></span>
                </div>
                <span>Consultar Produtos</span>
            </a>
        </div>
        <div class="col-6">
            <a th:href="@{/vendas/nova}" class="card-menu">
                <div class="icon-wrap">
                    <i class="bi bi-cart-fill principal"></i>
                    <span class="badge-acao badge-add"><i class="bi bi-check-lg"></i></span>
                </div>
                <span>Realizar Vendas</span>
            </a>
        </div>
        <div class="col-4">
    <a th:href="@{/vendas}" class="card-menu">
        <div class="icon-wrap">
            <i class="bi bi-receipt principal"></i>
            <span class="badge-acao badge-search"><i class="bi bi-search"></i></span>
        </div>
        <span>Consultar Vendas</span>
    </a>
</div>
    </div>

</div>
</body>
</html>
