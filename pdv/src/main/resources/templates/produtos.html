<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produtos - PDV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/images/css/theme.css" rel="stylesheet">
</head>
<body>
    <body>
<div th:replace="~{menu :: menu}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Produtos</h2>
        <a th:href="@{/produtos/novo}" class="btn btn-success">+ Novo Produto</a>
    </div>
    <form method="get" th:action="@{/produtos/buscar}" class="d-flex mb-3" style="max-width: 400px;">
    <input type="number" name="id" class="form-control me-2" placeholder="Digite o ID do produto">
    <button type="submit" class="btn btn-primary">Buscar</button>
    <a th:href="@{/produtos}" class="btn btn-secondary ms-2">Ver todos</a>
</form>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Código</th>
            <th>Nome</th>
            <th>Preço Venda</th>
            <th>Estoque</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="produto : ${produtos}">
            <td th:text="${produto.codigoBarras}"></td>
            <td th:text="${produto.nome}"></td>
            <td th:text="${produto.precoVenda}"></td>
            <td th:text="${produto.quantidadeEstoque}"></td>
            <td th:text="${produto.status}"></td>
            <td>
                <a th:href="@{/produtos/{id}/editar(id=${produto.idProduto})}" class="btn btn-sm btn-primary">Editar</a>
                <form th:action="@{/produtos/{id}/excluir(id=${produto.idProduto})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Excluir este produto?')">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
